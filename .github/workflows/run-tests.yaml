name: Testing

env:
 BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches:
      - "main"

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        check-latest: true
    - run: npm install
    # rebuild _src/dist and the import map from package-lock.json: they must match the committed ones
    - name: Check _src/dist and the import map
      run: |
        npm run build
        git diff --exit-code -- head.html 404.html _src/dist
        test -z "$(git ls-files --others --exclude-standard -- _src/dist)"
    - run: npm run lint
      env:
        CI: true
  unit_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        check-latest: true
    - run: npm install
    - run: npm run test
      env:
        CI: true
