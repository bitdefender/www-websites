name: Testing

env:
 BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches:
      - "main"

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        check-latest: true
    - run: npm install
    # _src/ is generated from src/ and package-lock.json: it must match a rebuild
    - name: Check the generated _src
      run: |
        npm run build
        git diff --exit-code -- _src
        test -z "$(git ls-files --others --exclude-standard -- _src)"
    - run: npm run lint
      env:
        CI: true
  unit_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        check-latest: true
    - run: npm install
    - run: npm run test
      env:
        CI: true
