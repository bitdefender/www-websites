name: Testing

env:
 BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches:
      - "main"

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        check-latest: true
    - run: npm install
    # regenerate the import map from package-lock.json: it must match the committed one
    - name: Check the import map
      run: |
        node .husky/update-importmap.js
        git diff --exit-code -- head.html 404.html
    - run: npm run lint
      env:
        CI: true
  unit_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        check-latest: true
    - run: npm install
    - run: npm run test
      env:
        CI: true
